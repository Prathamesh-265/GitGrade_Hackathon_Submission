<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GitGrade Pro</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top, #1e293b, #020617);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #e5e7eb;
    }

    .card {
      width: 440px;
      background: rgba(2, 6, 23, 0.85);
      backdrop-filter: blur(12px);
      padding: 32px;
      border-radius: 18px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(99, 102, 241, 0.25);
    }

    .title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 16px;
      text-align: center;
      color: #ffffff;
    }

    .subtitle {
      font-size: 14px;
      text-align: center;
      color: #94a3b8;
      margin-bottom: 28px;
    }

    label {
      font-size: 13px;
      font-weight: 500;
      color: #cbd5f5;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      margin-top: 8px;
      border-radius: 10px;
      border: 1px solid #1e293b;
      background: #020617;
      color: #e5e7eb;
      font-size: 14px;
      outline: none;
    }

    input::placeholder {
      color: #64748b;
    }

    input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.3);
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #ffffff;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
    }

    .output {
      margin-top: 24px;
      padding: 16px;
      border-radius: 12px;
      background: #020617;
      border: 1px solid #1e293b;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .footer {
      margin-top: 22px;
      text-align: center;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="title">GitGrade</div>
    <div class="subtitle">
      AI-powered GitHub Repository Evaluation
    </div>

    <label for="repo">GitHub Repository URL</label>
    <input
      id="repo"
      type="text"
      placeholder="https://github.com/username/project"
    />

    <button onclick="analyze()">Analyze Repository</button>

    <div id="out" class="output" style="display:none;"></div>

    <div class="footer">
      Built for GitGrade Hackathon
    </div>
  </div>

  <script>
    async function analyze() {
      const output = document.getElementById("out");
      output.style.display = "block";
      output.innerText = "Analyzing repository…";

      try {
        const res = await fetch("http://localhost:5000/analyze", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            repoUrl: document.getElementById("repo").value
          })
        });

        const d = await res.json();

        output.innerText =
          "Score: " + d.score + " / 100\n\n" +
          "Summary:\n" + d.summary + "\n\n" +
          "Personalized Roadmap:\n- " + d.roadmap.join("\n- ");
      } catch {
        output.innerText = "Error analyzing repository. Check backend.";
      }
    }
  </script>
</body>
</html>
